<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEGIS — Enterprise Authentication Gateway</title>
  <meta name="description" content="AEGIS Clinical Decision Support Authentication Gateway">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #07070d;
      --bg-secondary: #0e0e18;
      --bg-tertiary: #161625;
      --accent-primary: #6c5ce7;
      --accent-secondary: #a29bfe;
      --accent-cyan: #00cec9;
      --accent-red: #ff6b6b;
      --text-primary: #eaeaf4;
      --text-secondary: #9d9db8;
      --text-muted: #55556e;
      --border-subtle: rgba(108, 92, 231, 0.18);
      --border-focus: rgba(108, 92, 231, 0.55);
      --shadow-card: 0 12px 40px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(108, 92, 231, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: "";
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 500px;
      background: radial-gradient(circle, rgba(108, 92, 231, 0.12) 0%, rgba(0, 206, 201, 0.04) 50%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 38px 32px 32px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(16px);
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-icon-wrapper {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(108, 92, 231, 0.25), rgba(0, 206, 201, 0.15));
      border: 1px solid rgba(108, 92, 231, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      color: var(--accent-cyan);
      box-shadow: 0 4px 16px rgba(108, 92, 231, 0.2);
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ffffff, var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .system-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(0, 206, 201, 0.08);
      border: 1px solid rgba(0, 206, 201, 0.25);
      color: var(--accent-cyan);
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 10px;
    }

    .system-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    .error-alert {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #ff9999;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      line-height: 1.4;
      margin-bottom: 22px;
      animation: fadeIn 0.2s ease-in-out;
    }

    .error-alert.active {
      display: flex;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      transition: color 0.15s ease;
    }

    .form-input {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px 14px 12px 42px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input.has-toggle {
      padding-right: 44px;
    }

    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.18);
      background: rgba(22, 22, 37, 0.95);
    }

    .form-input:focus + .input-icon,
    .form-input:focus ~ .input-icon {
      color: var(--accent-secondary);
    }

    .form-input::placeholder {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .password-toggle-btn {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
    }

    .password-toggle-btn:hover {
      color: var(--text-primary);
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-primary), #5241d6);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 13px 20px;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      margin-top: 10px;
      box-shadow: 0 4px 16px rgba(108, 92, 231, 0.35);
    }

    .submit-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #7c6df0, var(--accent-primary));
      box-shadow: 0 6px 20px rgba(108, 92, 231, 0.5);
      transform: translateY(-1px);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      box-shadow: none;
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .submit-btn.loading .spinner {
      display: inline-block;
    }

    .submit-btn.loading .btn-text {
      opacity: 0.8;
    }

    .compliance-footer {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .compliance-text {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-icon-wrapper">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <h1 class="brand-title">AEGIS</h1>
        <p class="brand-subtitle">Clinical Decision Support Gateway</p>
        <div class="system-badge">
          <span class="system-badge-dot"></span>
          <span>ENTERPRISE GATEWAY</span>
        </div>
      </div>

      <div id="errorAlert" class="error-alert" role="alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorMessage">Invalid credentials.</span>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="username">Personnel Identifier</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-input" 
              placeholder="e.g. physician-id" 
              required 
              autofocus 
              autocomplete="username"
            />
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Security Passphrase</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input has-toggle" 
              placeholder="••••••••••••" 
              required 
              autocomplete="current-password"
            />
            <span class="input-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <button type="button" id="togglePasswordBtn" class="password-toggle-btn" aria-label="Show or hide passphrase" title="Show or hide passphrase">
              <!-- Eye open icon -->
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Eye off icon -->
              <svg id="eyeOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-text">Authenticate & Enter Terminal</span>
        </button>
      </form>

      <div class="compliance-footer">
        <p class="compliance-text">
          Authorized clinical personnel only. Access and actions are cryptographically audited under HIPAA 45 CFR § 164.312.
        </p>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const loginForm = document.getElementById("loginForm");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const togglePasswordBtn = document.getElementById("togglePasswordBtn");
      const eyeIcon = document.getElementById("eyeIcon");
      const eyeOffIcon = document.getElementById("eyeOffIcon");
      const submitBtn = document.getElementById("submitBtn");
      const errorAlert = document.getElementById("errorAlert");
      const errorMessage = document.getElementById("errorMessage");

      // Password visibility toggle
      togglePasswordBtn.addEventListener("click", function() {
        const isPassword = passwordInput.getAttribute("type") === "password";
        passwordInput.setAttribute("type", isPassword ? "text" : "password");
        eyeIcon.style.display = isPassword ? "none" : "block";
        eyeOffIcon.style.display = isPassword ? "block" : "none";
      });

      function showError(msg) {
        errorMessage.textContent = msg || "Access Denied: Invalid credentials.";
        errorAlert.classList.add("active");
        submitBtn.classList.remove("loading");
        submitBtn.disabled = false;
      }

      function clearError() {
        errorAlert.classList.remove("active");
      }

      usernameInput.addEventListener("input", clearError);
      passwordInput.addEventListener("input", clearError);

      loginForm.addEventListener("submit", async function(e) {
        e.preventDefault();
        clearError();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
          showError("Please enter both Medical Personnel ID and Passphrase.");
          return;
        }

        submitBtn.classList.add("loading");
        submitBtn.disabled = true;

        try {
          const response = await fetch("/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ username, password })
          });

          const data = await response.json().catch(() => ({}));

          if (response.ok && data.success) {
            // Authentication successful — navigate to existing application
            window.location.href = "/";
          } else {
            showError(data.error || "Access Denied: Invalid identifier or security passphrase.");
          }
        } catch (err) {
          showError("Network or server connection error. Please try again.");
        }
      });
    })();
  </script>
</body>
</html>
